plugins {
  id 'java'
  id 'checkstyle'
  id 'org.springframework.boot' version '3.0.3'
  id 'io.spring.dependency-management' version '1.1.0'
  id "io.github.lognet.grpc-spring-boot" version '5.0.0'
  id "io.freefair.lombok" version '6.6.3'
}

checkstyle {
  configFile file("$projectDir/checkstyle/google_checks.xml")
  toolVersion '10.8.0'
  maxWarnings 0
  ignoreFailures false
  showViolations true

  configProperties = [
    "org.checkstyle.google.suppressionfilter.config": "${projectDir}/checkstyle/suppressions.xml",
  ]
}
checkstyleMain.source = 'src/main/java'
checkstyleTest.source = 'src/test/java'


group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'

  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  implementation 'mysql:mysql-connector-java:8.0.32'
  implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.1'

  implementation 'one.util:streamex:0.8.1'
}

tasks.named('test') {
  useJUnitPlatform()
}

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}
